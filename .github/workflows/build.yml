name: build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  iso:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - run: nix build .#default
      - run: |
          mkdir -p dist
          cp result/iso/*.iso dist/
          xz -9e dist/*.iso
      - uses: actions/upload-artifact@v4
        with:
          name: onixos-iso
          path: dist/*.iso.xz
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "oNixOs build ${{ github.run_number }}"
          body: |
            Automated build from commit ${{ github.sha }}

            1. Download both part_aa and part_ab
            2. Open the folder in cmd and run:
            ```
            copy /b part_aa + part_ab onixos-iso.img
            ```
            3. Flash onixos-iso.img to USB with Etcher or dd
          files: dist/*.iso.xz
          make_latest: true
