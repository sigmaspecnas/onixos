name: build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  iso:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - run: nix build .#default
      - run: |
          mkdir -p dist
          cp result/iso/*.iso dist/
          split -b 1500M dist/*.iso dist/part_
      - uses: actions/upload-artifact@v4
        with:
          name: onixos-iso
          path: dist/part_*
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "oNixOs build ${{ github.run_number }}"
          body: |
            Automated build from commit ${{ github.sha }}

            To assemble the ISO:
            ```
            cat onixos-iso.part_* > onixos-iso.img
            ```
            Then flash to USB with `dd` or Etcher.
          files: dist/part_*
          make_latest: true
