name: build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  iso:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: DeterminateSystems/magic-nix-cache-action@v9
      - run: nix build .#default
      - run: |
          mkdir -p dist
          cp result/iso/*.iso dist/
          split -b 2000M dist/*.iso dist/part_
      - uses: actions/upload-artifact@v4
        with:
          name: onixos-iso
          path: dist/part_*
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "oNixOs build ${{ github.run_number }}"
          body: |
            Automated build from commit ${{ github.sha }}

            1. Download all part_* files
            2. Open folder in cmd: type path in address bar, write cmd, Enter
            3. Run: copy /b part_aa + part_ab onixos-iso.img
            4. Flash onixos-iso.img to USB with Etcher or dd
          files: dist/part_*
          make_latest: true
